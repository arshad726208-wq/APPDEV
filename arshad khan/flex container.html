<!DOCTYPE html>
<html>
<head>
  <title>Flex Container</title>
  <style>
    .flex-container {
      display: flex;
      background-color: lightblue;
    }
    .flex-container div {
      background-color: coral;
      margin: 10px;
      padding: 20px;
      font-size: 30px;
    }
  </style>
</head>
<body>
  <h2>Flex Container Example</h2>
  <div class="flex-container">
    <div>1</div>
    <div>2</div>
    <div>3</div>
  </div>
</body>
</html>
